services:
  - type: web
    name: react-udemy-backend
    env: node
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
    # Note: PORT is automatically set by Render, no need to specify
    # AI chat (backend proxy) – add in Render Dashboard > Environment:
    # - OPENAI_API_KEY (optional, for OpenAI/GPT)
    # - PERPLEXITY_API_KEY (optional, for Perplexity)
    # - GEMINI_API_KEY (optional, for Google Gemini)
    # Optional: Add your Stripe key if needed
    # - key: STRIPE_SECRET_KEY
    #   sync: false

