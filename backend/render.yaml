services:
  - type: web
    name: react-udemy-backend
    env: node
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
    # Note: PORT is automatically set by Render, no need to specify
    # Optional: Add your Stripe key if needed
    # - key: STRIPE_SECRET_KEY
    #   sync: false

