  <circle cx="380" cy="180" r="4" fill="#FBBF24" opacity="0.8"/>
  <circle cx="120" cy="340" r="4" fill="#14B8A6" opacity="0.8"/>
  <circle cx="390" cy="320" r="4" fill="#14B8A6" opacity="0.8"/>
  
