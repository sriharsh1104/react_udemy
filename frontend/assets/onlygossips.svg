      <stop offset="0%" style="stop-color:#6B46C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4C1D95;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- White circle background -->
  <circle cx="256" cy="256" r="240" fill="#FFFFFF" stroke="#4C1D95" stroke-width="20"/>
  
  <!-- Brand name arched at top -->
  <path id="topText" d="M 100 120 Q 256 80 412 120" fill="none"/>
  <text fill="#4C1D95" font-family="Arial, sans-serif" font-size="28" font-weight="bold">
    <textPath href="#topText" startOffset="50%" text-anchor="middle">onlygossips247</textPath>
  </text>
  
  <!-- Tagline arched at bottom -->
  <path id="bottomText" d="M 100 392 Q 256 432 412 392" fill="none"/>
