  <line x1="10" y1="22" x2="10" y2="26" stroke="#475569" stroke-width="1.5"/>
  <line x1="22" y1="22" x2="22" y2="26" stroke="#475569" stroke-width="1.5"/>
  <rect x="8" y="26" width="16" height="2" rx="1" fill="#475569"/>
</svg>
